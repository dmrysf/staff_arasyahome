name: Operations API Quality & Package

on:
  push:
    branches:
      - main
    paths:
      - "operations-api/**"
      - "integrations/**"
      - "docs/operations-api-auth.md"
      - "docs/staff-auth-security.md"
      - "docs/operations-api-cpanel.md"
      - "docs/production-workflow.md"
      - "docs/production-reliability.md"
      - "docs/central-iam.md"
      - "docs/production-overview.md"
      - "docs/production-control.md"
      - "docs/pilot-readiness.md"
      - "docs/b2b-companies.md"
      - "docs/b2b-orders.md"
      - "docs/b2b-production.md"
      - "docs/b2b-projects.md"
      - "docs/management-analytics.md"
      - ".github/workflows/operations-api-ci.yml"
  pull_request:
    paths:
      - "operations-api/**"
      - "integrations/**"
      - "docs/operations-api-auth.md"
      - "docs/staff-auth-security.md"
      - "docs/operations-api-cpanel.md"
      - "docs/production-workflow.md"
      - "docs/production-reliability.md"
      - "docs/central-iam.md"
      - "docs/production-overview.md"
      - "docs/production-control.md"
      - "docs/pilot-readiness.md"
      - "docs/b2b-companies.md"
      - "docs/b2b-orders.md"
      - "docs/b2b-production.md"
      - "docs/b2b-projects.md"
      - "docs/management-analytics.md"
      - ".github/workflows/operations-api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arasya-operations-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: arasya_operations_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Validate PHP syntax
        run: find operations-api integrations -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate migration structure
        run: php operations-api/bin/check-migrations.php

      - name: Run backend unit and security tests
        run: php operations-api/tests/run.php && php operations-api/tests/order-calculator.php

      - name: Guard inbound-only source integrations
        run: php operations-api/tests/inbound-only-guard.php

      - name: Test API release validator
        run: /bin/bash operations-api/tests/release-validation.sh

      - name: Test two-target cPanel deployment
        run: /bin/bash operations-api/tests/deploy-api.sh

      - name: Test the nightly maintenance launcher (absolute PHP CLI)
        run: /bin/bash operations-api/tests/maintenance-launcher.sh

      - name: Run MySQL integration lifecycle
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-integration.php

      - name: Run MySQL Staff operations lifecycle
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-operations-integration.php && php operations-api/tests/mysql-source-connection-integration.php

      - name: Run MySQL central IAM lifecycle
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-iam-integration.php

      - name: Run MySQL production overview aggregation
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-production-overview-integration.php

      - name: Run MySQL production control lifecycle
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-production-control-integration.php

      - name: Run MySQL production ownership interventions
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-production-ownership-integration.php

      - name: Run MySQL B2B companies lifecycle
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-b2b-companies-integration.php
      - name: Run MySQL B2B commercial orders lifecycle and races
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-b2b-orders-integration.php
      - name: Run MySQL B2B current account ledger, allocations, exports and races
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-b2b-accounts-integration.php

      - name: Run MySQL explicit B2B production handoff and races
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/b2b-production-input.php && php operations-api/tests/mysql-b2b-production-integration.php

      - name: Run MySQL B2B project workspace, conversion, traceability and PDFs
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-b2b-projects-integration.php

      - name: Run MySQL production exceptions, live approvals and organisation controls
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-production-exceptions-integration.php && php operations-api/tests/cutting-time.php && php operations-api/tests/mysql-cutting-integration.php && php operations-api/tests/analytics-formulas.php && php operations-api/tests/mysql-analytics-integration.php

      - name: Run MySQL production documents, QR revisions, approvals and races
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-production-documents-integration.php

      - name: Run MySQL production authority control plane, takeover races and ingestion invariants
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-production-authority-integration.php

      - name: Run MySQL production QR authority, rotation races and scan invariants
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-production-qr-integration.php

      - name: Run MySQL production document authority, source issue races and revocation
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-production-document-authority-integration.php

      - name: Run MySQL customer tracking authority, milestones and source isolation
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-customer-tracking-integration.php

      - name: Run MySQL organization IAM, source-scoped document authority and exception accountability
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-organization-iam-integration.php

      - name: Run MySQL employee onboarding provisioner, first login and password-change limits
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_operations_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/mysql-organization-onboarding-integration.php

      - name: Measure MySQL analytics against three years of canonical history
        env:
          ARASYA_TEST_DB_HOST: 127.0.0.1
          ARASYA_TEST_DB_PORT: "3306"
          ARASYA_TEST_DB_NAME: arasya_analytics_performance_test
          ARASYA_TEST_DB_USER: root
          ARASYA_TEST_DB_PASSWORD: root-test-password
        run: php operations-api/tests/analytics-performance.php

  mariadb-compatibility:
    # Production cPanel runs MariaDB 10.11; the MySQL lifecycles must also pass there.
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-test-password
          MARIADB_DATABASE: arasya_operations_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ARASYA_TEST_DB_HOST: 127.0.0.1
      ARASYA_TEST_DB_PORT: "3306"
      ARASYA_TEST_DB_NAME: arasya_operations_test
      ARASYA_TEST_DB_USER: root
      ARASYA_TEST_DB_PASSWORD: root-test-password
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Run MariaDB integration lifecycle
        run: php operations-api/tests/mysql-integration.php

      - name: Run MariaDB Staff operations lifecycle
        run: php operations-api/tests/mysql-operations-integration.php && php operations-api/tests/mysql-source-connection-integration.php

      - name: Run MariaDB central IAM lifecycle
        run: php operations-api/tests/mysql-iam-integration.php

      - name: Run MariaDB production overview aggregation
        run: php operations-api/tests/mysql-production-overview-integration.php

      - name: Run MariaDB production control lifecycle
        run: php operations-api/tests/mysql-production-control-integration.php

      - name: Run MariaDB production ownership interventions
        run: php operations-api/tests/mysql-production-ownership-integration.php

      - name: Run MariaDB B2B companies lifecycle
        run: php operations-api/tests/mysql-b2b-companies-integration.php
      - name: Run MariaDB B2B commercial orders lifecycle and races
        run: php operations-api/tests/mysql-b2b-orders-integration.php
      - name: Run MariaDB B2B current account ledger, allocations, exports and races
        run: php operations-api/tests/mysql-b2b-accounts-integration.php
      - name: Run MariaDB explicit B2B production handoff and races
        run: php operations-api/tests/b2b-production-input.php && php operations-api/tests/mysql-b2b-production-integration.php
      - name: Run MariaDB B2B project workspace, conversion, traceability and PDFs
        run: php operations-api/tests/mysql-b2b-projects-integration.php
      - name: Run MariaDB production exceptions, live approvals and organisation controls
        run: php operations-api/tests/mysql-production-exceptions-integration.php && php operations-api/tests/cutting-time.php && php operations-api/tests/mysql-cutting-integration.php && php operations-api/tests/analytics-formulas.php && php operations-api/tests/mysql-analytics-integration.php
      - name: Run MariaDB production documents, QR revisions, approvals and races
        run: php operations-api/tests/mysql-production-documents-integration.php
      - name: Run MariaDB production authority control plane, takeover races and ingestion invariants
        run: php operations-api/tests/mysql-production-authority-integration.php
      - name: Run MariaDB production QR authority, rotation races and scan invariants
        run: php operations-api/tests/mysql-production-qr-integration.php
      - name: Run MariaDB production document authority, source issue races and revocation
        run: php operations-api/tests/mysql-production-document-authority-integration.php
      - name: Run MariaDB customer tracking authority, milestones and source isolation
        run: php operations-api/tests/mysql-customer-tracking-integration.php
      - name: Run MariaDB organization IAM, source-scoped document authority and exception accountability
        run: php operations-api/tests/mysql-organization-iam-integration.php
      - name: Run MariaDB employee onboarding provisioner, first login and password-change limits
        run: php operations-api/tests/mysql-organization-onboarding-integration.php

      - name: Measure MariaDB analytics against three years of canonical history
        env:
          ARASYA_TEST_DB_NAME: arasya_analytics_performance_test
        run: php operations-api/tests/analytics-performance.php

  publish-api-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality, mariadb-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare dependency-free API release
        shell: bash
        run: |
          set -Eeuo pipefail
          release_dir="$RUNNER_TEMP/operations-api-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$release_dir/config" "$release_dir/scripts"
          cp operations-api/bootstrap.php "$release_dir/bootstrap.php"
          cp operations-api/.htaccess "$release_dir/.htaccess"
          cp operations-api/.cpanel.yml "$release_dir/.cpanel.yml"
          cp operations-api/README.md "$release_dir/README.md"
          cp -R operations-api/public operations-api/src operations-api/database operations-api/bin "$release_dir/"
          cp operations-api/config/config.example.php "$release_dir/config/config.example.php"
          cp operations-api/config/config.production.example.php "$release_dir/config/config.production.example.php"
          cp operations-api/config/secrets.example.json "$release_dir/config/secrets.example.json"
          cp operations-api/scripts/*.sh "$release_dir/scripts/"
          chmod +x "$release_dir/scripts/"*.sh
          printf '{\n  "sourceCommit": "%s",\n  "builtAt": "%s",\n  "version": "2.23.0"\n}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$release_dir/release.json"
          php -r '$r=json_decode(file_get_contents($argv[1]), true, flags: JSON_THROW_ON_ERROR); if (($r["sourceCommit"] ?? null) !== getenv("GITHUB_SHA") || ($r["version"] ?? null) !== "2.23.0") { throw new RuntimeException("API release metadata does not match source."); }' "$release_dir/release.json"
          grep -Fq "public const VERSION = '2.23.0';" "$release_dir/src/Http/HealthController.php"
          /bin/bash "$release_dir/scripts/generate-sha256s.sh" "$release_dir"
          ARASYA_RELEASE_STRICT=1 /bin/bash "$release_dir/scripts/validate-release.sh" "$release_dir"

      - name: Publish isolated api-deploy branch
        shell: bash
        run: |
          set -Eeuo pipefail
          release_dir="$RUNNER_TEMP/operations-api-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          publish_dir="$RUNNER_TEMP/operations-api-deploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin api-deploy >/dev/null 2>&1; then
            git fetch --depth=1 origin api-deploy
            git worktree add --detach "$publish_dir" FETCH_HEAD
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" checkout --orphan api-deploy
            git -C "$publish_dir" rm -rf .
          fi
          rsync --archive --checksum --delete --exclude='.git' "$release_dir/" "$publish_dir/"
          cmp "$release_dir/release.json" "$publish_dir/release.json"
          cmp "$release_dir/SHA256SUMS" "$publish_dir/SHA256SUMS"
          cmp "$release_dir/src/Http/HealthController.php" "$publish_dir/src/Http/HealthController.php"
          git -C "$publish_dir" add --all
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "api-deploy already matches the verified release."
            exit 0
          fi
          git -C "$publish_dir" commit -m "build: publish Operations API from ${GITHUB_SHA:0:7}"
          git -C "$publish_dir" push origin HEAD:api-deploy
